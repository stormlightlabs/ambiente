name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show && rustup target add wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Install wasm-bindgen test runner
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Test WebAssembly conformance
        run: CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner cargo test --package ambiente-wasm --test conformance --target wasm32-unknown-unknown

  web:
    name: TypeScript and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Install Rust WebAssembly toolchain
        run: rustup target add wasm32-unknown-unknown && cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:web:check
      - name: Lint TypeScript and JavaScript
        run: pnpm lint:web
      - name: Install browser
        run: pnpm --filter @ambiente/web exec playwright install --with-deps chromium
      - name: Test
        run: pnpm test:web
